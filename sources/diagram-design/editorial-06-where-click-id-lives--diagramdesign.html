<!DOCTYPE html>

<head>

<title>Where the click ID actually lives</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
  --font-sans: 'Geist', system-ui, sans-serif;
  --font-serif: 'Instrument Serif', 'Noto Serif', serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;
}
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
  letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Layer stack &middot; Diagram Design</p>
<h1>Where the click ID actually lives</h1>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="06-where-click-id-lives-title 06-where-click-id-lives-desc">
<title id="06-where-click-id-lives-title">Where the click ID actually lives</title>
<desc id="06-where-click-id-lives-desc">Three storage layers each hold a piece of the attribution puzzle: the URL parameter, the first-party cookie, and the platform click log.</desc>
<defs>
<marker id="06-where-click-id-lives-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="06-where-click-id-lives-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="06-where-click-id-lives-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="06-where-click-id-lives-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
<marker id="06-where-click-id-lives-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="380" y1="296" x2="380" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-where-click-id-lives-arrow)"/><line x1="380" y1="408" x2="380" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#06-where-click-id-lives-arrow)"/><line x1="140" y1="300" x2="140" y2="220" stroke="#7a8399" stroke-width="1.2" marker-end="url(#06-where-click-id-lives-arrow-soft)"/><text x="184" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">L1</text><text x="240" y="240" fill="#2d3142" font-size="15" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">URL PARAMETER</text><text x="240" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">lives in the address bar</text><text x="700" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">gclid · fbclid · ttclid</text><text x="700" y="264" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">fragile — lost on redirect or refresh</text><text x="184" y="346" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">L2</text><text x="240" y="352" fill="#2d3142" font-size="15" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">FIRST-PARTY COOKIE</text><text x="240" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">lives on the site's domain</text><text x="700" y="352" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">_gcl_aw · _fbp · _ttp</text><text x="700" y="376" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">robust — survives navigation</text><text x="184" y="458" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">L3</text><text x="240" y="464" fill="#2d3142" font-size="15" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">PLATFORM BACKEND</text><text x="240" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">lives in the ad system</text><text x="700" y="464" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">click log + attribution window</text><text x="700" y="488" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">durable — waiting for a match</text><text x="136" y="176" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">abstraction</text><text x="40" y="640" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">Coral = the layer that carries the signal across a page change. Without it the URL is gone before the conversion happens.</text><rect x="160" y="200" width="960" height="96" rx="6" fill="#f5f5f5"/><rect x="160" y="200" width="960" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><rect x="160" y="312" width="960" height="96" rx="6" fill="#f5f5f5"/><rect x="160" y="312" width="960" height="96" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><rect x="160" y="424" width="960" height="96" rx="6" fill="#f5f5f5"/><rect x="160" y="424" width="960" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
</svg>
</div>
