<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="08-attribution-decision-flow-title 08-attribution-decision-flow-desc">
<title id="08-attribution-decision-flow-title">How a conversion gets credited</title>
<desc id="08-attribution-decision-flow-desc">A conversion is credited to an ad only if it carries a stored click ID, falls inside the attribution window, and is not double-counted.</desc>
<defs>
<marker id="08-attribution-decision-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="08-attribution-decision-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="08-attribution-decision-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="08-attribution-decision-flow-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
<marker id="08-attribution-decision-flow-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="640" y1="124" x2="640" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><line x1="640" y1="248" x2="640" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><line x1="640" y1="384" x2="640" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><line x1="640" y1="520" x2="640" y2="576" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow-accent)"/><path d="M 768 212 L 838.0 212.0 A 2.0 2.0 0 0 0 840.0 212.0 L 840.0 212.0 A 2.0 2.0 0 0 0 842.0 212.0 L 936 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><path d="M 768 348 L 838.0 348.0 A 2.0 2.0 0 0 0 840.0 348.0 L 840.0 348.0 A 2.0 2.0 0 0 0 842.0 348.0 L 936 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><path d="M 768 484 L 838.0 484.0 A 2.0 2.0 0 0 0 840.0 484.0 L 840.0 484.0 A 2.0 2.0 0 0 0 842.0 484.0 L 936 484" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#08-attribution-decision-flow-arrow)"/><rect x="840" y="192" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="852" y="201" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="840" y="328" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="852" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="840" y="464" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="852" y="473" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="654" y="130" width="27" height="12" rx="2" fill="#f5f5f5"/><text x="668" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="654" y="266" width="27" height="12" rx="2" fill="#f5f5f5"/><text x="668" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="654" y="402" width="27" height="12" rx="2" fill="#f5f5f5"/><text x="668" y="411" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><text x="40" y="668" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">Coral = the single happy path. Every other branch is a reason the number in Ads Manager is wrong.</text><rect x="520" y="72" width="240" height="52" rx="6" fill="#f5f5f5"/><rect x="520" y="72" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="640" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conversion event</text><rect x="512" y="176" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="512" y="176" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="520" y="182" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="541.5" y="191" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE 1</text><text x="640" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Carries a stored click ID?</text><text x="640" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decision gate</text><rect x="512" y="312" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="512" y="312" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="520" y="318" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="541.5" y="327" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE 2</text><text x="640" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inside the attribution window?</text><text x="640" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7 · 30 · 90 days</text><rect x="512" y="448" width="256" height="72" rx="6" fill="#f5f5f5"/><rect x="512" y="448" width="256" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="520" y="454" width="43" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="541.5" y="463" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE 3</text><text x="640" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Same event_id from pixel + CAPI?</text><text x="640" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dedup check</text><rect x="512" y="584" width="256" height="64" rx="6" fill="#f5f5f5"/><rect x="512" y="584" width="256" height="64" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><rect x="520" y="590" width="43" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/><text x="541.5" y="599" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text><text x="640" y="612" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conversion credited</text><text x="640" y="628" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">campaign ▸ ad set ▸ ad</text><rect x="944" y="176" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="944" y="176" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1064" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modelled conversion</text><text x="1064" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">estimated from similar users</text><rect x="944" y="312" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="944" y="312" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1064" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Not credited</text><text x="1064" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outside the window</text><rect x="944" y="448" width="240" height="64" rx="6" fill="#f5f5f5"/><rect x="944" y="448" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="1064" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Counted twice</text><text x="1064" y="492" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fix your event_id</text>
</svg>