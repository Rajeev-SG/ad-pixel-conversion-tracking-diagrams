<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-click-journey-timeline-title 04-click-journey-timeline-desc">
<title id="04-click-journey-timeline-title">Six seconds inside the click</title>
<desc id="04-click-journey-timeline-desc">The whole attribution chain from ad click to recorded conversion happens in seconds, then the match can wait for days.</desc>
<defs>
<marker id="04-click-journey-timeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="04-click-journey-timeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="04-click-journey-timeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="04-click-journey-timeline-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
<marker id="04-click-journey-timeline-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="120" y1="392" x2="1160" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#)"/><text x="116" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">T+0ms</text><text x="1148" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">T+days</text><text x="180" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+0ms</text><text x="180" y="492" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">User clicks the ad</text><text x="392" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+50ms</text><text x="392" y="492" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Click ID appended to the URL</text><text x="604" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+1s</text><text x="604" y="492" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Landing page loads; base tag reads it</text><text x="816" y="300" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+2s</text><text x="816" y="280" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Click ID written to first-party cookie</text><text x="1028" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+minutes</text><text x="1028" y="492" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">User converts; event tag fires</text><text x="1160" y="472" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T+seconds</text><text x="1160" y="492" fill="#2d3142" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Platform matches and credits</text><text x="40" y="600" fill="#7a8399" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">The click-ID cookie is the bridge: written at T+2s, read again whenever the user finally converts.</text><text x="40" y="632" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">Coral marks the step the whole attribution chain depends on.</text><line x1="120" y1="386" x2="120" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="300" y1="386" x2="300" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="480" y1="386" x2="480" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="660" y1="386" x2="660" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="840" y1="386" x2="840" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="1020" y1="386" x2="1020" y2="398" stroke="#4f5d75" stroke-width="1"/><line x1="1160" y1="386" x2="1160" y2="398" stroke="#4f5d75" stroke-width="1"/><circle cx="180" cy="392" r="4" fill="#2d3142"/><line x1="180" y1="398" x2="180" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><circle cx="392" cy="392" r="4" fill="#2d3142"/><line x1="392" y1="398" x2="392" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><circle cx="604" cy="392" r="4" fill="#2d3142"/><line x1="604" y1="398" x2="604" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><circle cx="816" cy="392" r="6" fill="#eb6c36"/><line x1="816" y1="386" x2="816" y2="316" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><circle cx="1028" cy="392" r="4" fill="#2d3142"/><line x1="1028" y1="398" x2="1028" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><circle cx="1160" cy="392" r="4" fill="#2d3142"/><line x1="1160" y1="398" x2="1160" y2="452" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
</svg>