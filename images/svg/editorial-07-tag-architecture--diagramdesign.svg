<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-tag-architecture-title 07-tag-architecture-desc">
<title id="07-tag-architecture-title">Tag architecture: what runs where</title>
<desc id="07-tag-architecture-desc">What runs where: a base tag on every page writes the click cookie, an event tag fires on conversion, and a server-side layer adds resilience.</desc>
<defs>
<marker id="07-tag-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
