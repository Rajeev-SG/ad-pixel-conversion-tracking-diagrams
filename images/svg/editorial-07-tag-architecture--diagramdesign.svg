anchor="middle" letter-spacing="0.08em">STORES ID</text><text x="860" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cookie layer</text><text x="860" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">_gcl_aw · _fbp · _ttp</text><rect x="120" y="428" width="264" height="88" rx="6" fill="#f5f5f5"/><rect x="120" y="428" width="264" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="128" y="434" width="64" height="12" rx="2" fill="transparent" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="160.0" y="443" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESILIENCE</text><text x="252" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Server-side API</text><text x="252" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CAPI · Events API</text><rect x="424" y="428" width="264" height="88" rx="6" fill="#f5f5f5"/><rect x="424" y="428" width="264" height="88" rx="6" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1"/><rect x="432" y="434" width="43" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-opacity="0.40" stroke-width="0.8"/><text x="453.5" y="443" fill="#eb6c36" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CREDIT</text><text x="556" y="468" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Matching engine</text><text x="556" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">click ID → ad click</text><rect x="728" y="428" width="264" height="88" rx="6" fill="#f5f5f5"/><rect x="728" y="428" width="264" height="88" rx="6" fill="rgba(45,49,6