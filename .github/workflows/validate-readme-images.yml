name: validate-readme-images

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-image-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Every README image must exist
        run: python3 scripts/validate_readme_images.py
